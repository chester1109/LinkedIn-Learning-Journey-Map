<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">

<title>Global LinkedIn Learning Hub</title>
<!--
  ══════════════════════════════════════════════════════════════════
  LinkedIn Learning 全球學習進度地圖 — 單一自包含 HTML(無外部相依)
  ══════════════════════════════════════════════════════════════════
  給 IT 的佈署/接資料說明:

  1. 本檔可直接放上任何靜態網站或 iframe 嵌入,不需要任何 CDN、
     字型或 JS 函式庫,亦不發出任何對外請求。活動照片放在同層的
     photos/ 資料夾(相對路徑),上架時整個資料夾一起搬。
  2. 所有「測試資料」集中在下方 <script> 開頭的 DASHBOARD_DATA 物件:
       - totals      三個頂部統計磁貼
       - deltas      三個磁貼的「較上週」增量(設 null 可隱藏該列)
       - sites       五個據點(參與人數 participants、啟動率 activationRate、
                     完成課程 courses、經緯度 lon/lat、資訊卡位置 card、
                     活動花絮 event:activities[name,src,emoji,caption,
                     quotes[text,who]] / likes / teamsUrl)
       - topLearners Top 10 Learner 排行(name / site / hours,
                     依 hours 自動排序取前 10 名;
                     空陣列 [] = 累計區間尚未開始,排行榜顯示空狀態)
       - updatedAt   最後更新時間;null = 顯示頁面載入時間
     之後接正式 API 時,取得同結構的資料後呼叫 renderDashboard(apiData)
     即可整頁重繪(也可先覆寫全域變數 DASHBOARD_DATA 再呼叫
     renderDashboard(),兩種寫法皆可)。
  3. 新增據點:在 sites 加一筆,填入 lon / lat(WGS84),
     地圖標記位置會由內建 project() 自動換算;card.x / card.y 為
     資訊卡左上角在 1000x470 座標系中的位置,自行挑一塊海面即可。
  4. 世界地圖(大洲形狀 + 城市燈光)由 Natural Earth 110m(公有領域)
     資料預先計算並內嵌於 SVG,無需維護;重新產生方式見 tools/README.md。
  5. 據點卡片可點擊 → 活動花絮彈窗:
       - 一張輪播 = 一個活動(activities 陣列),第一個固定放 AI Literacy Journey;
         標題、活動名與留言區會跟著目前輪播的活動切換。
       - activities[].src 填入照片網址(訓練網站上的相對路徑即可)就會
         顯示真實照片;留空則顯示佔位圖卡。照片規格:16:9(建議
         1280x720),非 16:9 會置中裁切。
       - teamsUrl 填該據點 Teams 頻道連結;留空會隱藏按鈕("#" 為 demo
         哨兵,點了不跳頁)。
       - 「打氣」數 = likes 基數 + 使用者本機的 +1(存 localStorage);
         跨使用者的即時總數需另接後端 API 時,覆寫 likes 即可。
       - 深連結:網址帶 #site=據點ID(如 #site=WYMY)直接開啟彈窗。
-->
<script>
  /* 主題早期定調:先於畫面渲染套上 data-theme,避免載入時閃一下錯色。
     優先用使用者存過的選擇(llmap-theme),否則跟隨系統 prefers-color-scheme。 */
  (function () {
    try {
      var saved = localStorage.getItem("llmap-theme");
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
    } catch (err) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
<style>
  :root {
    color-scheme: light dark;
    --page:        #f2f5fa;
    --card:        #ffffff;
    --ink:         #14213b;
    --ink-2:       #5a6b85;
    --ink-3:       #5d6d84;
    --brand:       #0a66c2;
    --brand-deep:  #0d3b66;
    --hairline:    rgba(20, 33, 59, 0.10);
    --tile-shadow: 0 1px 2px rgba(16, 34, 61, 0.05), 0 8px 24px rgba(16, 34, 61, 0.06);
    --good:        #0c7a3d;
    /* 深色地圖面板 */
    --panel-1:     #0a1c36;
    --panel-2:     #10294e;
    --panel-ink:   #ffffff;
    --panel-ink-2: #b8cbe4;
    --panel-ink-3: #7e94b5;
    --panel-line:  rgba(184, 203, 228, 0.14);
    --glow:        #ffc94d;
    --glow-soft:   rgba(255, 201, 77, 0.16);
    --teal:        #2dd4bf;
  }
  /* 深色主題:由 <html data-theme="dark"> 觸發(JS 依使用者選擇/系統設定設定)。
     頁首腳本已先套上 data-theme,因此不再直接依賴 @media,改由屬性驅動可手動切換。 */
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d1320;
    --card:        #162034;
    --ink:         #eef3fb;
    --ink-2:       #a7b6cc;
    --ink-3:       #8b9fb8;
    --brand:       #5aa4e8;
    --brand-deep:  #cfe2f5;
    --hairline:    rgba(255, 255, 255, 0.10);
    --tile-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.25);
    --good:        #3ecf7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.55;
  }
  .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 40px; position: relative; z-index: 1; }
  /* ── 可切換背景(預設/星空/極光)── */
  #bgFx {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(3px 3px at 22% 24%, rgba(255,255,255,0.95), rgba(150,190,255,0.35) 45%, transparent 72%),
      radial-gradient(3px 3px at 74% 18%, rgba(255,255,255,0.95), rgba(200,170,255,0.35) 45%, transparent 72%),
      radial-gradient(2.6px 2.6px at 54% 66%, rgba(255,255,255,0.92), rgba(150,220,220,0.35) 45%, transparent 72%),
      radial-gradient(3px 3px at 88% 60%, rgba(255,255,255,0.92), rgba(150,190,255,0.32) 45%, transparent 72%),
      radial-gradient(1.8px 1.8px at 12% 16%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 34% 40%, #fff, transparent),
      radial-gradient(2px 2px at 44% 12%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 64% 34%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 82% 40%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 8% 62%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 30% 78%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 50% 90%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 68% 86%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 92% 78%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 20% 52%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 96% 22%, #fff, transparent),
      radial-gradient(42% 32% at 18% 22%, rgba(56,96,224,0.30), transparent 70%),
      radial-gradient(46% 36% at 82% 28%, rgba(130,70,240,0.28), transparent 70%),
      radial-gradient(48% 40% at 62% 82%, rgba(24,170,190,0.22), transparent 72%),
      radial-gradient(34% 26% at 42% 56%, rgba(232,96,140,0.16), transparent 70%),
      radial-gradient(92% 34% at 50% 112%, rgba(90,164,232,0.40), transparent 70%),
      radial-gradient(130% 100% at 50% -12%, #24407e 0%, #172a5e 32%, #0f1c42 62%, #0a1330 100%);
  }
  #bgFx::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(1.4px 1.4px at 18% 30%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 40% 20%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 62% 44%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 76% 64%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 30% 66%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 88% 34%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 52% 80%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 10% 46%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 70% 12%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 26% 88%, #fff, transparent);
    animation: twinkle 4s ease-in-out infinite;
  }
  #bgFx::after {
    content: ""; position: absolute; top: 10%; left: 0;
    width: 160px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), #fff);
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.5);
    opacity: 0; transform: translate(-180px, 0) rotate(16deg);
    animation: shoot 8s ease-in infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  @keyframes shoot {
    0% { opacity: 0; transform: translate(-180px, 0) rotate(16deg); }
    3% { opacity: 1; }
    15% { opacity: 0; transform: translate(66vw, 24vh) rotate(16deg); }
    100% { opacity: 0; transform: translate(66vw, 24vh) rotate(16deg); }
  }
  @media (prefers-reduced-motion: reduce) { #bgFx::before { animation: none; } #bgFx::after { display: none; } }

  /* ── 頁首 ─────────────────────────────── */
  .hero { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .overline { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--brand); text-transform: uppercase; }
  .hero h1 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 700; letter-spacing: 0.01em; color: var(--ink); margin-top: 2px; }
  .hero .sub { font-size: 15px; color: var(--ink-2); margin-top: 4px; }
  .hero-baseline { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
  .hero-lead { display: flex; align-items: center; gap: 12px; }
  .title-mark { flex: none; width: 46px; height: 46px; display: grid; place-items: center; animation: markGlow 3.4s ease-in-out infinite; border-radius: 50%; }
  .title-mark svg { width: 46px; height: 46px; display: block; }
  @keyframes markGlow { 0%, 100% { filter: drop-shadow(0 0 6px rgba(90, 164, 232, 0.45)); } 50% { filter: drop-shadow(0 0 14px rgba(90, 164, 232, 0.8)); } }
  @media (prefers-reduced-motion: reduce) { .title-mark { animation: none; } }
  .hero-baseline .sub { margin-top: 0; }
  .hero-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
  .hero-actions { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--ink-2);
    box-shadow: var(--tile-shadow);
  }
  .hero-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: livepulse 2.4s ease-in-out infinite; }
  @keyframes livepulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .hero-tools { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 12px; }
  .theme-toggle {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--hairline); color: var(--ink-2);
    cursor: pointer; box-shadow: var(--tile-shadow);
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--brand); }
  .theme-toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .theme-toggle svg { width: 20px; height: 20px; }
  /* 淺色時顯示月亮(點了切深色);深色時顯示太陽(點了切淺色) */
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* 頁首主要行動:前往 LinkedIn Learning(固定 LinkedIn 藍,深淺色皆維持白字對比約 5.7:1) */
  .cta-ll {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    background: #0a66c2; color: #ffffff; text-decoration: none;
    border: none; border-radius: 999px; padding: 10px 18px;
    font-size: 14px; font-weight: 650; letter-spacing: 0.01em; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(10, 102, 194, 0.25), 0 6px 18px rgba(10, 102, 194, 0.28);
    transition: filter 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .cta-ll:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .cta-ll:active { transform: translateY(0); }
  .cta-ll:focus-visible { outline: 2px solid #0a66c2; outline-offset: 2px; }
  .cta-ll svg { width: 18px; height: 18px; flex: none; }
  .cta-ll .arrow { transition: transform 0.2s; }
  .cta-ll:hover .arrow { transform: translateX(3px); }

  /* 頁首次要行動:操作說明 SOP(與 LinkedIn Learning 同級,配色區分) */
  .cta-sop {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    background: #0f766e; color: #ffffff; text-decoration: none;
    border: none; border-radius: 999px; padding: 10px 18px;
    font-size: 14px; font-weight: 650; letter-spacing: 0.01em; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(15, 118, 110, 0.25), 0 6px 18px rgba(15, 118, 110, 0.28);
    transition: filter 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .cta-sop:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .cta-sop:active { transform: translateY(0); }
  .cta-sop:focus-visible { outline: 2px solid #0f766e; outline-offset: 2px; }
  .cta-sop svg { width: 18px; height: 18px; flex: none; }
  .cta-sop .arrow { transition: transform 0.2s; }

  /* 語言切換(繁中 / EN)分段按鈕 */
  .lang-toggle { flex: none; display: inline-flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--hairline); border-radius: 999px; padding: 2px; box-shadow: var(--tile-shadow); }
  .lang-toggle button { border: none; background: transparent; color: var(--ink-2); cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 650; line-height: 1; padding: 6px 11px; border-radius: 999px; transition: background 0.2s, color 0.2s; }
  .lang-toggle button:hover { color: var(--ink); }
  .lang-toggle button.on { background: var(--brand); color: #ffffff; }
  :root[data-theme="dark"] .lang-toggle button.on { color: #0d1b30; }
  .lang-toggle button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  /* ── 達標型 KPI + 合規卡 ── */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; padding: 16px 18px; box-shadow: var(--tile-shadow); display: flex; flex-direction: column; }
  .kpi-head { display: flex; align-items: flex-start; gap: 10px; }
  .kpi-ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
  .kpi-ic svg { width: 19px; height: 19px; }
  .kpi-tt { flex: 1; min-width: 0; }
  .kpi-label { font-size: 13.5px; font-weight: 650; color: var(--ink); }
  .kpi-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .kpi-tag { flex: none; font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: 0.02em; }
  .kpi-body { margin-top: 12px; display: flex; align-items: baseline; gap: 7px; }
  .kpi-val { font-size: 30px; font-weight: 680; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi-target { font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .kpi-note { margin-top: 5px; font-size: 12px; font-weight: 600; }
  .note-good { color: var(--good); }
  .note-warn { color: #b47800; }
  .note-bad { color: #c0392b; }
  .kpi-sites { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--hairline); }
  .kpi-sites-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: transparent; border: none; padding: 3px 0; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .kpi-sites-toggle:hover { color: var(--ink); }
  .kpi-sites-toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  .kpi-sites-toggle .chev { flex: none; width: 15px; height: 15px; transition: transform 0.2s; }
  .kpi-sites-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .kpi-sites-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .kpi-sites-list[hidden] { display: none; }
  .kpi-site { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .kpi-site .cmark { flex: none; width: 13px; text-align: center; font-weight: 700; }
  .kpi-site .code { flex: 1; color: var(--ink-2); font-weight: 600; }
  .kpi-site .r { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
  .tone-green .kpi-ic { background: rgba(12, 122, 61, 0.10); color: var(--good); }
  .tone-green .kpi-val { color: var(--good); }
  .tone-green .kpi-tag { background: rgba(12, 122, 61, 0.10); color: var(--good); }

  .tone-amber .kpi-val { color: #b47800; }
  .tone-amber .kpi-tag { background: rgba(180, 120, 0, 0.12); color: #b47800; }
  .tone-blue .kpi-ic { background: rgba(10, 102, 194, 0.10); color: var(--brand); }
  .tone-blue .kpi-val { color: var(--brand); }
  .tone-blue .kpi-tag { background: rgba(10, 102, 194, 0.10); color: var(--brand); }
  :root[data-theme="dark"] .tone-amber .kpi-val { color: #ffd166; }
  :root[data-theme="dark"] .tone-amber .kpi-ic { background: rgba(255, 201, 77, 0.12); color: #ffd166; }
  :root[data-theme="dark"] .tone-amber .kpi-tag { background: rgba(255, 201, 77, 0.12); color: #ffd166; }

  :root[data-theme="dark"] .note-bad { color: #f2705f; }

  .compliance { background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; padding: 18px 20px; box-shadow: var(--tile-shadow); margin-bottom: 14px; }
  .comp-ic { background: rgba(12, 122, 61, 0.10); color: var(--good); }
  .comp-metric { background: rgba(20, 33, 59, 0.06); color: var(--ink-2); }
  .comp-main { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
  .comp-figure { flex: none; }
  .comp-progress { flex: 1 1 160px; min-width: 140px; }
  .comp-track { height: 10px; border-radius: 6px; background: rgba(10, 102, 194, 0.14); overflow: hidden; }
  .comp-track i { display: block; height: 100%; border-radius: 6px; background: var(--brand); }
  :root[data-theme="dark"] .comp-track { background: rgba(90, 164, 232, 0.24); }
  .comp-val { font-size: 34px; font-weight: 680; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .comp-gap { text-align: right; }
  .comp-gap-v { display: block; font-size: 15px; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
  .st-good { color: var(--good); }
  .st-warn { color: #b47800; }
  .st-bad { color: #c0392b; }
  :root[data-theme="dark"] .st-warn { color: #ffd166; }
  :root[data-theme="dark"] .st-bad { color: #f2705f; }
  :root[data-theme="dark"] .comp-metric { background: rgba(255, 255, 255, 0.08); color: var(--ink-2); }
  /* ── 活動推播牆 ── */
  .bcast { margin-bottom: 14px; }
  .bcast-view { position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--tile-shadow); }
  .bslide { display: none; position: relative; aspect-ratio: 2.33 / 1; min-height: 330px; padding: 26px 30px; color: #ffffff; overflow: hidden; }
  .bslide.on { display: block; }
  .tone-party { background: linear-gradient(120deg, #5b21b6 0%, #be185d 55%, #1d4ed8 100%); }
  .tone-challenge { background: linear-gradient(120deg, #0f766e 0%, #1d4ed8 100%); }
  .tone-leader { background: linear-gradient(120deg, #b45309 0%, #ea580c 100%); }
  .bdeco { position: absolute; inset: 0; z-index: 0; }
  .bdeco::before { content: ""; position: absolute; width: 360px; height: 360px; border-radius: 50%; background: rgba(255, 255, 255, 0.09); top: -130px; right: -70px; }
  .bdeco::after { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: rgba(255, 255, 255, 0.06); bottom: -110px; left: 26%; }
  .bdeco-img { background-size: cover; background-position: center; }
  /* bare:EDM 完整呈現(不裁切、淡遮罩) */
  .bslide.bare { background: #06080f; } /* 滿版 EDM 兩側留白用黑色,不用 tone 漸層 */
  .bslide.bare .bdeco-img { background-size: contain; background-repeat: no-repeat; background-position: center; }
  .bslide.bare .bdeco-img::after { background: linear-gradient(to top, rgba(8, 16, 34, 0.32) 0%, rgba(8, 16, 34, 0.16) 55%, rgba(8, 16, 34, 0.24) 100%); }
  .bare-link { position: absolute; inset: 0; display: block; z-index: 1; cursor: pointer; }
  .bare-link:focus-visible { outline: 3px solid var(--glow); outline-offset: -3px; }
  .bdeco-img::before { content: none; }
  .bdeco-img::after { content: ""; position: absolute; inset: 0; width: auto; height: auto; border-radius: 0; background: linear-gradient(to top, rgba(8, 16, 34, 0.45) 0%, rgba(8, 16, 34, 0) 46%), linear-gradient(90deg, rgba(8, 16, 34, 0.70) 0%, rgba(8, 16, 34, 0.40) 60%, rgba(8, 16, 34, 0.22) 100%); }
  .bslide-inner { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 16px; height: 100%; min-height: 278px; justify-content: space-between; }
  .bhead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .bhead { min-width: 0; }
  .btag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255, 255, 255, 0.2); padding: 3px 10px; border-radius: 999px; }
  .btitle { font-size: clamp(22px, 3vw, 32px); font-weight: 800; margin-top: 10px; color: #ffffff; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.25); }
  .bsub { font-size: 15px; margin-top: 6px; color: rgba(255, 255, 255, 0.94); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35); }
  .bfeatures { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; }
  .bfeatures li { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #ffffff; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.3); padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
  .bck { flex: none; width: 15px; height: 15px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); color: #16a34a; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .bsteps { display: flex; flex-wrap: wrap; gap: 8px; }
  .bsteps span { font-size: 12px; font-weight: 600; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.3); padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
  .bsteps .bgift { background: rgba(255, 255, 255, 0.92); color: #7c3aed; border-color: transparent; }
  .bcta { flex: none; align-self: flex-start; background: #ffffff; color: #1d3b66; font-weight: 700; font-size: 14px; text-decoration: none; padding: 11px 22px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); transition: filter 0.2s, transform 0.2s; }
  .bcta:hover { filter: brightness(0.95); transform: translateY(-1px); }
  .bcast-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 18px; line-height: 1; z-index: 3; display: grid; place-items: center; }
  .bcast-btn:hover { background: rgba(0, 0, 0, 0.5); }
  .bcast-prev { left: 12px; }
  .bcast-next { right: 12px; }
  .bcast-dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; gap: 7px; justify-content: center; z-index: 3; }
  .bcast-dots button { width: 9px; height: 9px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: rgba(255, 255, 255, 0.5); }
  .bcast-dots button.on { background: #ffffff; }
  /* ── 遊戲感 / 引導 ── */
  .lb li .rank.medal { background: none; box-shadow: none; font-size: 20px; }
  .bcta { animation: bctaPulse 2.4s ease-in-out infinite; }
  @keyframes bctaPulse { 0%, 100% { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); } 50% { box-shadow: 0 6px 12px rgba(0, 0, 0, 0.18), 0 0 0 6px rgba(255, 255, 255, 0.22); } }
  .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
  .confetti-p { position: fixed; transform: translate(-50%, -50%); will-change: transform, opacity; animation: confPop 1s ease-out forwards; }
  @keyframes confPop { 0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15) rotate(35deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bcta { animation: none; } }
  @media (max-width: 640px) { .bslide { padding: 20px; min-height: 0; aspect-ratio: auto; } .bslide-inner { min-height: 0; } .bcta { width: 100%; text-align: center; } }

  /* ── 統計磁貼 ─────────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .tile {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 16px;
    padding: 18px 20px; display: flex; align-items: center; gap: 14px;
    box-shadow: var(--tile-shadow);
  }
  .tile .icon {
    flex: none; width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center;
  }
  .tile .icon svg { width: 24px; height: 24px; }
  .tile:nth-child(1) .icon { background: rgba(10, 102, 194, 0.10); color: #0a66c2; }
  .tile:nth-child(2) .icon { background: rgba(13, 148, 136, 0.10); color: #0d9488; }
  .tile:nth-child(3) .icon { background: rgba(180, 120, 0, 0.12); color: #b47800; }
  :root[data-theme="dark"] .tile:nth-child(1) .icon { background: rgba(90, 164, 232, 0.14); color: #7ab8f0; }
  :root[data-theme="dark"] .tile:nth-child(2) .icon { background: rgba(45, 212, 191, 0.12); color: #4fd8c6; }
  :root[data-theme="dark"] .tile:nth-child(3) .icon { background: rgba(255, 201, 77, 0.12); color: #ffd166; }
  :root[data-theme="dark"] .rate-bar { background: rgba(90, 164, 232, 0.28); }
  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .value { font-size: 30px; font-weight: 650; line-height: 1.15; color: var(--ink); }
  .tile .delta { font-size: 12.5px; color: var(--good); font-weight: 600; margin-top: 1px; }
  .tile .delta .vs { color: var(--ink-3); font-weight: 400; }

  /* ── 地圖面板 ─────────────────────────── */
  .board {
    display: grid; grid-template-columns: minmax(0, 1fr) 288px; gap: 0;
    background: linear-gradient(160deg, var(--panel-1) 0%, var(--panel-2) 100%);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 2px 6px rgba(6, 18, 38, 0.18), 0 18px 48px rgba(6, 18, 38, 0.22);
  }
  .mapcol { min-width: 0; padding: 22px 10px 12px 24px; display: flex; flex-direction: column; }
  .map-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-right: 12px; }
  .map-head h2 { font-size: 19px; font-weight: 700; color: var(--panel-ink); letter-spacing: 0.02em; }
  .map-head .tag { font-size: 13px; color: var(--panel-ink-2); }
  .mapwrap { position: relative; margin-top: 4px; }
  .mapwrap svg { display: block; width: 100%; height: auto; }

  .map-foot {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    border-top: 1px solid var(--panel-line); padding: 10px 12px 4px 0; font-size: 12.5px; color: var(--panel-ink-3);
  }
  .map-foot .hint { display: inline-flex; align-items: center; gap: 7px; }
  .map-foot .hint .spark { width: 9px; height: 9px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 8px 2px var(--glow-soft); }

  /* SVG 內部 */
  .land {
    fill: url(#landGrad);
    stroke: rgba(126, 178, 232, 0.28);
    stroke-width: 0.6;
    filter: drop-shadow(0 0 9px rgba(46, 104, 178, 0.35));
  }
  .leader { stroke: rgba(184, 203, 228, 0.45); stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
  .beam   { opacity: 0.75; }
  .halo   { fill: var(--glow); opacity: 0.16; transform-box: fill-box; transform-origin: center; animation: halo 3s ease-in-out infinite; }
  .core   { fill: var(--glow); stroke: rgba(255, 255, 255, 0.85); stroke-width: 1.6; }
  @keyframes halo { 0%,100% { transform: scale(1); opacity: 0.14; } 50% { transform: scale(1.45); opacity: 0.30; } }
  .site:hover .halo { opacity: 0.4; }

  .scard {
    width: 100%; height: 100%;
    background: rgba(13, 32, 61, 0.82);
    border: 1px solid rgba(184, 203, 228, 0.22);
    border-radius: 10px; padding: 8px 11px 9px;
    color: var(--panel-ink);
    transition: border-color 0.2s, background 0.2s;
    font-family: inherit;
  }
  .site:hover .scard { border-color: rgba(255, 201, 77, 0.55); background: rgba(16, 40, 74, 0.92); }
  .scard { line-height: 1.25; }
  .scard .s-name { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scard .s-city { font-size: 10.5px; font-weight: 400; color: var(--panel-ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scard .s-count { margin-top: 2px; font-size: 12px; color: var(--panel-ink-2); display: flex; align-items: center; gap: 5px; }
  .scard .s-count svg { width: 13px; height: 13px; color: var(--teal); flex: none; }
  .scard .s-count b { font-size: 16px; font-weight: 650; color: var(--panel-ink); }
  .scard .meter { margin-top: 5px; height: 5px; border-radius: 3px; background: var(--glow-soft); overflow: hidden; }
  .scard .meter i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--glow); transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); }
  .scard .s-rate { margin-top: 3px; font-size: 10.5px; color: var(--panel-ink-3); transition: opacity 0.18s; }

  /* 窄螢幕:SVG 內的資訊卡會縮到不可讀,改在地圖下方鋪一排原尺寸卡片 */
  .site-list { display: none; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; padding-right: 12px; }
  .site-list .scard { height: auto; }

  /* 據點卡為純資訊卡(活動花絮功能已停用) */
  .site { cursor: default; }
  .scard { position: relative; }
  .scard .s-hint {
    position: absolute; left: 11px; right: 11px; bottom: 9px;
    font-size: 10.5px; color: var(--glow); opacity: 0;
    transition: opacity 0.18s; pointer-events: none; white-space: nowrap;
  }
  .scard:focus-visible { outline: 2px solid var(--glow); outline-offset: -2px; } /* 內縮:foreignObject 會裁掉外凸的外框 */
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* 觸控裝置沒有 hover:列表卡的提示常駐顯示 */
  .site-list .scard .s-hint { position: static; opacity: 1; display: block; margin-top: 4px; }
  .site-list .scard:hover .s-rate, .site-list .scard:focus-visible .s-rate { opacity: 1; }

  /* ── 活動花絮彈窗 ─────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(7, 14, 28, 0.62);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    width: min(560px, 100%); max-height: min(88vh, 760px); max-height: min(88dvh, 760px); overflow: auto;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 18px;
    box-shadow: 0 24px 80px rgba(4, 12, 28, 0.45);
    padding: 20px 22px 18px;
    animation: pop 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.15);
  }
  @keyframes pop { from { transform: scale(0.94); opacity: 0; } }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .modal-head .ev-site { font-size: 12.5px; font-weight: 700; color: var(--brand); letter-spacing: 0.05em; }
  .modal-head h3 { font-size: 20px; line-height: 1.3; margin-top: 2px; }
  .modal-close {
    flex: none; border: none; background: transparent; cursor: pointer;
    font-size: 20px; line-height: 1; color: var(--ink-2); padding: 8px; border-radius: 10px;
  }
  .modal-close:hover { background: var(--hairline); color: var(--ink); }

  .carousel { position: relative; margin-top: 14px; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--panel-1); }
  .carousel .slides { position: absolute; inset: 0; }
  /* 底部漸層墊片:真實照片偏亮時,導覽圓點仍看得見 */
  .carousel::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    background: linear-gradient(transparent, rgba(6, 14, 30, 0.55));
    pointer-events: none; z-index: 1;
  }
  .carousel .slide { position: absolute; inset: 0; display: none; }
  .carousel .slide.on { display: block; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide .ph {
    width: 100%; height: 100%; display: grid; place-content: center; justify-items: center; gap: 8px;
    background: linear-gradient(150deg, #16335c, #0f2547 55%, #24406c); color: #dbe7f7; text-align: center; padding: 12px;
  }
  .slide .ph .emoji { font-size: 46px; line-height: 1; }
  .slide .ph .cap { font-size: 13px; color: #b8cbe4; }
  .car-btn {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(10, 20, 40, 0.55); color: #fff; font-size: 18px; line-height: 1;
    display: grid; place-items: center;
  }
  .car-btn:hover { background: rgba(10, 20, 40, 0.85); }
  .car-prev { left: 10px; }
  .car-next { right: 10px; }
  .car-dots { position: absolute; bottom: 9px; left: 0; right: 0; z-index: 2; display: flex; gap: 7px; justify-content: center; }
  .car-dots button { width: 8px; height: 8px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: rgba(255, 255, 255, 0.38); }
  .car-dots button.on { background: var(--glow); }

  .ev-meta { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--ink-2); }
  .ev-meta b { color: var(--ink); }
  .ev-quotes { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ev-quotes blockquote {
    font-size: 13px; color: var(--ink-2);
    background: rgba(10, 102, 194, 0.06); border-left: 3px solid var(--brand);
    padding: 8px 12px; border-radius: 0 8px 8px 0;
  }
  .ev-quotes .who { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  :root[data-theme="dark"] .ev-quotes blockquote { background: rgba(90, 164, 232, 0.08); }
  /* 深色的 --brand 偏亮,白字對比不足,改深色字(拉高權重以蓋過後方的基礎規則) */
  :root[data-theme="dark"] .ev-actions .btn-primary { color: #0d1b30; }
  .ev-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--brand); color: #fff; border: none; border-radius: 999px;
    padding: 9px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-like {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid var(--hairline); color: var(--ink-2);
    border-radius: 999px; padding: 8px 16px; font-size: 13.5px; cursor: pointer;
  }
  .btn-like:hover { border-color: rgba(224, 86, 120, 0.45); color: var(--ink); }
  .btn-like.liked { color: #d0435f; border-color: rgba(224, 86, 120, 0.45); background: rgba(224, 86, 120, 0.08); }
  :root[data-theme="dark"] .btn-like.liked { color: #f08aa2; }
  .btn-board { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 999px; padding: 8px 16px; font-size: 13.5px; cursor: pointer; font-family: inherit; }
  .btn-board:hover { border-color: var(--brand); color: var(--ink); }
  .btn-board:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .ev-board { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ev-board[hidden] { display: none; }
  .ev-board input, .ev-board textarea { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13.5px; color: var(--ink); background: var(--page); border: 1px solid var(--hairline); border-radius: 10px; padding: 8px 11px; resize: vertical; }
  .ev-board input:focus, .ev-board textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.15); }
  .ev-board-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .ev-board-hint { flex: 1; min-width: 130px; font-size: 11.5px; color: var(--ink-3); }
  .ev-quotes blockquote.mine { border-left-color: var(--teal); background: rgba(45, 212, 191, 0.08); }

  /* ── 最新動態 ─────────────────────────── */
  .feed {
    border-left: 1px solid var(--panel-line);
    padding: 22px 20px; display: flex; flex-direction: column; min-width: 0;
    background: rgba(8, 20, 40, 0.35);
  }
  .feed h2 { font-size: 15px; font-weight: 700; color: var(--panel-ink); letter-spacing: 0.03em; display: flex; align-items: center; gap: 8px; }
  .feed h2 .live { font-size: 10.5px; font-weight: 600; color: var(--teal); border: 1px solid rgba(45, 212, 191, 0.4); border-radius: 999px; padding: 1px 8px; letter-spacing: 0.06em; }
  .feed h2 .flame { flex: none; width: 18px; height: 18px; color: var(--glow); filter: drop-shadow(0 0 4px rgba(255, 201, 77, 0.45)); }
  .feed ol.lb { list-style: none; margin-top: 10px; display: flex; flex-direction: column; }
  .lb li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--panel-line); }
  .lb li:last-child { border-bottom: none; }
  .lb .rank {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12.5px; font-weight: 700;
    color: var(--panel-ink-2); background: rgba(184, 203, 228, 0.10);
  }
  .lb li:nth-child(1) .rank { background: linear-gradient(135deg, #ffd97a, #ffc94d); color: #0a1c36; }
  .lb li:nth-child(2) .rank { background: linear-gradient(135deg, #dce6f2, #b9c8dc); color: #0a1c36; }
  .lb li:nth-child(3) .rank { background: linear-gradient(135deg, #e2b185, #c98e5a); color: #0a1c36; }
  .lb .who { flex: 1; min-width: 0; }
  .lb .who .nm { font-size: 13px; font-weight: 650; color: var(--panel-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb .who .st { font-size: 11px; color: var(--panel-ink-3); }
  .lb .hrs { flex: none; text-align: right; font-size: 14px; font-weight: 650; color: var(--panel-ink); font-variant-numeric: tabular-nums; }
  .lb .hrs span { font-size: 10.5px; font-weight: 400; color: var(--panel-ink-3); margin-left: 2px; }

  /* Top 10 空狀態(累計尚未開始):獎盃 + 說明 + 骨架佔位 */
  .lb li.lb-soon { display: block; border-bottom: none; padding: 4px 0 0; }
  .lb-soon-head { text-align: center; padding: 10px 0 16px; }
  .lb-trophy { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 10px rgba(255, 201, 77, 0.45)); }
  .lb-soon-title { margin-top: 10px; font-size: 14.5px; font-weight: 700; color: var(--panel-ink); }
  .lb-soon-sub { margin-top: 6px; font-size: 12.5px; color: var(--panel-ink-2); line-height: 1.5; }
  .lb-soon-sub b { color: var(--glow); font-weight: 700; }
  .sk-list { display: flex; flex-direction: column; gap: 8px; }
  .sk-row { display: flex; align-items: center; gap: 10px; }
  .sk-rank {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12.5px; font-weight: 700;
    color: var(--panel-ink-3); background: rgba(184, 203, 228, 0.10);
  }
  .sk-rank.medal.m1 { background: linear-gradient(135deg, #ffd97a, #ffc94d); color: #0a1c36; }
  .sk-rank.medal.m2 { background: linear-gradient(135deg, #dce6f2, #b9c8dc); color: #0a1c36; }
  .sk-rank.medal.m3 { background: linear-gradient(135deg, #e2b185, #c98e5a); color: #0a1c36; }
  .sk-bar { height: 12px; border-radius: 6px; background: rgba(184, 203, 228, 0.14); animation: skPulse 1.9s ease-in-out infinite; }
  .sk-bar.sk-hrs { flex: none; width: 44px; margin-left: auto; }
  @keyframes skPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  /* 排行榜空狀態:累計區間(2026/9/1 起)還沒開始時顯示 */
  .lb li.empty { display: block; padding: 20px 4px; text-align: center; font-size: 12.5px;
                 line-height: 1.75; color: var(--panel-ink-3); border-bottom: none; }
  .lb li.empty .emo { display: block; font-size: 24px; margin-bottom: 8px; opacity: 0.9; }

  /* ── 據點明細表 ───────────────────────── */
  .detail { margin-top: 22px; background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--tile-shadow); overflow: hidden; }
  .detail h2 { font-size: 16px; font-weight: 700; padding: 16px 20px 0; }
  .detail .note { font-size: 12.5px; color: var(--ink-3); padding: 2px 20px 12px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 760px; }
  th, td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--hairline); vertical-align: top; }
  td:nth-child(2) { white-space: nowrap; }
  th:first-child, td:first-child { padding-left: 20px; }
  th:last-child, td:last-child { padding-right: 20px; }
  thead th { font-size: 12px; font-weight: 600; color: var(--ink-2); border-top: none; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .site-code { font-weight: 700; color: var(--ink); white-space: nowrap; }
  td .addr { color: var(--ink-2); font-size: 12.5px; }
  td .tel { white-space: nowrap; color: var(--ink-2); }
  .rate-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .rate-bar { width: 64px; height: 5px; border-radius: 3px; background: rgba(10, 102, 194, 0.14); overflow: hidden; flex: none; }
  .rate-bar i { display: block; height: 100%; border-radius: 3px; background: var(--brand); }

  footer.pagefoot { margin-top: 18px; font-size: 12px; color: var(--ink-3); text-align: center; }

  /* ── RWD ─────────────────────────────── */
  @media (max-width: 960px) {
    .board { grid-template-columns: 1fr; }
    .feed { border-left: none; border-top: 1px solid var(--panel-line); }
    .mapcol { padding: 18px 16px 10px; }
    #worldmap .leader, #worldmap foreignObject { display: none; }
    .site-list { display: grid; }
  }
  @media (max-width: 640px) {
    .page { padding: 20px 14px 32px; }
    .stats { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: 1fr; }
    .tile .value { font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .halo, .hero-badge .dot { animation: none; }
    .scard .meter i { transition: none; }
    .modal { animation: none; }
    .scard .s-hint { transition: none; }
    .sk-bar { animation: none; }
  }
</style>
</head>

function L(obj, key) {

/* ── 地圖投影(與點陣預計算使用相同參數,勿改) ── */
const MAP = { w: 1000, h: 470, lonMin: -180, lonMax: 180, latMin: -56, latMax: 78 };
function project(lon, lat) {
  return {
    x: (lon - MAP.lonMin) / (MAP.lonMax - MAP.lonMin) * MAP.w,
    y: (MAP.latMax - lat) / (MAP.latMax - MAP.latMin) * MAP.h
  };
}

const SVG_NS = "http://www.w3.org/2000/svg";
const XHTML_NS = "http://www.w3.org/1999/xhtml";
const CARD_W = 152, CARD_H = 100;
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(ns, tag, attrs) {
  const node = document.createElementNS(ns, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}

/* HTML 跳脫:之後 IT 接 API 資料時,避免站名/地址等欄位注入標籤 */
function esc(v) {
  return String(v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* 屬性選擇器跳脫(site id 含引號等特殊字元時仍可查詢) */
function cssEsc(v) {
  return window.CSS && CSS.escape ? CSS.escape(v) : String(v).replace(/["\\]/g, "\\$&");
}

function clampRate(v) {
  return Math.max(0, Math.min(100, Number(v) || 0));
}

/* 數字一律先轉型再格式化:API 若回傳字串,不會流進 innerHTML */

/* 資訊卡邊緣的引導線起點(依 anchor:tl/tr/bl/br) */
function cardAnchor(card, anchor) {
  const pad = 10;
  switch (anchor) {
    case "tl": return { x: card.x + pad,          y: card.y };
    case "tr": return { x: card.x + CARD_W - pad, y: card.y };
    case "bl": return { x: card.x + pad,          y: card.y + CARD_H };
    default:   return { x: card.x + CARD_W - pad, y: card.y + CARD_H };
  }
}

/* 數字滾動動畫。背景分頁不會觸發 rAF,故以計時器保底寫入最終值;
   節點上的世代序號讓重複呼叫 renderDashboard() 時舊動畫立即失效,
   不會有舊計時器把新數字蓋回去的競態 */
function countUp(node, target, duration) {
  target = Number(target) || 0;
  const finalText = target.toLocaleString("zh-Hant");
  const gen = (node._countGen = (node._countGen || 0) + 1);
  if (reducedMotion || duration <= 0 || document.hidden) {
    node.textContent = finalText;
    return;
  }
  const t0 = performance.now();
  function tick(t) {
    if (node._countGen !== gen) return;
    const k = Math.min(1, (t - t0) / duration);
    const eased = 1 - Math.pow(1 - k, 3);
    node.textContent = Math.round(target * eased).toLocaleString("zh-Hant");
    if (k < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(function () {
    if (node._countGen === gen) node.textContent = finalText;
  }, duration + 120);
}

        ? '<a class="bare-link" href="' + esc(bareLink) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(L(b, "title")) + '">' + bg + "</a>"
        : bg;
      slidesH += '<div class="bslide bare tone-' + esc(b.tone || "party") + (b.image ? " has-img" : "") + (i === 0 ? " on" : "") + '">' + bareInner + "</div>";
      dotsH += '<button type="button" aria-label="' + esc(L(b, "title")) + '"' + (i === 0 ? ' class="on" aria-current="true"' : "") + "></button>";
      continue;
    }
    slidesH += '<div class="bslide tone-' + esc(b.tone || "party") + (b.image ? " has-img" : "") + (i === 0 ? " on" : "") + '">' +
      bg +
      '<div class="bslide-inner">' +
        '<div class="bhead-row">' +
          '<div class="bhead">' +
            (b.tag ? '<span class="btag">' + esc(b.tag) + "</span>" : "") +
            '<h3 class="btitle">' + esc(L(b, "title")) + "</h3>" +
            (L(b, "sub") ? '<p class="bsub">' + esc(L(b, "sub")) + "</p>" : "") +
          "</div>" +
          ctaH +
        "</div>" +
        hi +
      "</div>" +
    "</div>";
    dotsH += '<button type="button" aria-label="' + esc(L(b, "title")) + '"' + (i === 0 ? ' class="on" aria-current="true"' : "") + "></button>";
  }
  const nav = items.length > 1 ?
    '<button class="bcast-btn bcast-prev" type="button" aria-label="' + esc(T("prevAct")) + '">‹</button>' +
    '<button class="bcast-btn bcast-next" type="button" aria-label="' + esc(T("nextAct")) + '">›</button>' +
    '<div class="bcast-dots">' + dotsH + "</div>" : "";
  wall.innerHTML = '<div class="bcast-view">' + slidesH + nav + "</div>";
  if (bcastIndex >= items.length) bcastIndex = 0;
  bcastGo(bcastIndex);
  bcastAuto();
}

/* 慶祝彩帶:打氣/送出留言時的小驚喜(reduced-motion 時略過) */
function celebrate(x, y) {
  if (reducedMotion) return;
  const icons = ["🎉", "✨", "🎊", "⭐", "💪", "🏆"];
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  document.body.appendChild(layer);
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("span");
    p.className = "confetti-p";
    p.textContent = icons[i % icons.length];
    p.style.left = x + "px";
    p.style.top = y + "px";
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 120;
    p.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(0) + "px");
    p.style.setProperty("--dy", (Math.sin(ang) * dist - 70).toFixed(0) + "px");
    p.style.fontSize = (12 + Math.random() * 16).toFixed(0) + "px";
    layer.appendChild(p);
  }
  setTimeout(function () { if (layer.parentNode) layer.parentNode.removeChild(layer); }, 1100);
}

function buildSlide(act) {
  const slide = document.createElement("div");
  slide.className = "slide";

    const img = document.createElement("img");
    img.src = act.src;
    img.alt = ((currentLang === "zh" ? (act.caption || act.name) : L(act, "name")) || T("photoAlt"));
    img.loading = "lazy";
    slide.appendChild(img);
  } else {
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.innerHTML =
      '<div class="emoji" aria-hidden="true">' + esc((act && act.emoji) || "📸") + "</div>" +
      '<div class="cap">' + esc((act && (currentLang === "zh" ? (act.caption || act.name) : L(act, "name"))) || T("photoPending")) + "</div>";
    slide.appendChild(ph);
  }
  return slide;
}

/* 相容舊資料結構(title + photos + quotes):視為同一活動的多張照片 */
function normalizeActivities(ev) {
  if (ev.activities && ev.activities.length) return ev.activities;
  const photos = ev.photos && ev.photos.length ? ev.photos : [null];
  return photos.map(function (p, i) {
    return {
      name: ev.title || "線上活動",
      src: p && p.src, emoji: p && p.emoji, caption: p && p.caption,
      quotes: i === 0 ? ev.quotes || [] : []

}

function goSlide(i) {

document.addEventListener("keydown", function (e) {
  if (evModal.hidden) return;

  if (e.key === "ArrowLeft") { goSlide(evIndex - 1); return; }
  if (e.key === "ArrowRight") { goSlide(evIndex + 1); return; }
  if (e.key === "Tab") {
    const nodes = evBox.querySelectorAll('button, a[href], input, textarea, select, [tabindex]:not([tabindex="-1"])');
    const list = [];
    for (const f of nodes) if (f.offsetParent !== null) list.push(f);
    if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    const active = document.activeElement;
    if (!evBox.contains(active)) { e.preventDefault(); first.focus(); } // 焦點在窗外(如點了不可聚焦的文字)時拉回窗內
    else if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
  }
});

/* ══ 每日數據:data.json ═══════════════════════════════════════════
   畫面文案、照片、i18n 都留在本檔;data.json 只帶「數字」,每天更新它即可。
   讀不到 data.json(例如本機用 file:// 直接開啟)就沿用下方內嵌的測試資料。
   結構範例:
   {
     "updatedAt": "2026-08-25T10:00:00+08:00",
     "kpis": [{ "key": "activation", "value": 78, "target": 90,
                "note": "🎯 目標達成率 86.7%",
                "sites": [{ "id": "WYHQ", "val": 93 }, ...] }, ...],
     "compliance": { "value": 91, "target": 100, "note": "剩餘 287 人未完成", "gap": "+9%" },
     "sites": [{ "id": "WYHQ", "participants": 872, "activationRate": 93, "courses": 1842 }, ...],
     "topLearners": [{ "name": "陳雅婷", "site": "WYHQ", "hours": 42.5 }, ...]
                     ↑ 給 [] 則刻意清空排行榜(累計區間 2026/9/1 起，尚未開始)
   }
   ══════════════════════════════════════════════════════════════ */
function isNum(v) { return typeof v === "number" && isFinite(v); }

function applyDataPatch(p) {
  if (!p || typeof p !== "object") return false;
  let touched = false;

  if (typeof p.updatedAt === "string" && p.updatedAt) { DASHBOARD_DATA.updatedAt = p.updatedAt; touched = true; }

  /* KPI:依 key 對應,只覆寫數字與註記 */
  if (Array.isArray(p.kpis)) {
    for (const src of p.kpis) {
      const dst = (DASHBOARD_DATA.kpis || []).find(function (k) { return k.key === src.key; });
      if (!dst) continue;
      if (isNum(src.value)) dst.value = src.value;
      if (isNum(src.target)) dst.target = src.target;
      if (typeof src.note === "string") { dst.note = src.note; dst.noteEn = src.noteEn || src.note; dst.noteEs = src.noteEs || src.note; }
      if (Array.isArray(src.sites)) {
        const rows = src.sites.filter(function (s) { return s && s.id != null && isNum(s.val); });
        if (rows.length) dst.sites = rows.map(function (s) { return { id: String(s.id), val: s.val }; });
      }
      touched = true;
    }
  }

  /* 合規卡 */
  if (p.compliance && DASHBOARD_DATA.compliance) {
    const c = p.compliance, dst = DASHBOARD_DATA.compliance;
    if (isNum(c.value)) dst.value = c.value;
    if (isNum(c.target)) dst.target = c.target;
    if (typeof c.note === "string") { dst.note = c.note; dst.noteEn = c.noteEn || c.note; dst.noteEs = c.noteEs || c.note; }
    if (typeof c.gap === "string") dst.gap = c.gap;
    /* 本卡只顯示總體完訓率,不吃據點分項(c.sites 已移除) */
    touched = true;
  }

  /* 據點卡片上的人數/啟動率/課程數(依 id 對應,不動名稱與活動內容) */
  if (Array.isArray(p.sites)) {
    for (const src of p.sites) {
      const dst = (DASHBOARD_DATA.sites || []).find(function (s) { return s.id === src.id; });
      if (!dst) continue;
      if (isNum(src.participants)) dst.participants = src.participants;
      if (isNum(src.activationRate)) dst.activationRate = src.activationRate;
      if (isNum(src.courses)) dst.courses = src.courses;
      touched = true;
    }
  }

  /* Top 10 排行榜 */
  if (Array.isArray(p.topLearners)) {
    /* 空陣列是有意義的:代表累計區間(2026/9/1 起)還沒開始,要清空排行榜 */
    DASHBOARD_DATA.topLearners =
      p.topLearners.filter(function (t) { return t && t.name && isNum(t.hours); });
    touched = true;
  }

  return touched;
}

(function () {
  /* file:// 直接開啟時 fetch 會被瀏覽器擋掉,直接用內嵌資料 */
  if (!window.fetch || location.protocol === "file:") return;
  fetch("data.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (applyDataPatch(j)) renderDashboard(); })
    .catch(function () { /* 沒有 data.json 就沿用內嵌資料 */ });
})();

/* demo: learningUrl 若為 "#"(哨兵)則不跳頁; IT 設定真實網址後正常於新分頁開啟 */
(function () {
  for (const id of ["ctaLearning", "ctaSop"]) {
    const a = document.getElementById(id);
    if (a) a.addEventListener("click", function (e) { if (this.getAttribute("href") === "#") e.preventDefault(); });
  }
})();

/* ── 深/淺色主題切換 ──────────────────────────────────
   頁首腳本已依 llmap-theme(或系統設定)先套上 data-theme;
   這裡負責按鈕切換、儲存選擇,並在使用者尚未手動選過時跟隨系統變化。 */
(function () {
  const root = document.documentElement;
  const btn = document.getElementById("themeToggle");
  if (!btn) return;

  function syncBtn() {
    const dark = root.getAttribute("data-theme") === "dark";
    const label = dark ? T("themeToLight") : T("themeToDark");
    btn.setAttribute("aria-label", label);
    btn.title = label;
    btn.setAttribute("aria-pressed", dark ? "true" : "false");
  }
  syncBtn();

  btn.addEventListener("click", function () {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("llmap-theme", next); } catch (err) { /* 隱私模式等情況忽略 */ }
    syncBtn();
  });

  /* 使用者沒手動選過時,即時跟隨系統深/淺色設定變化 */
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onSystemChange = function (e) {
      let chosen = false;
      try { chosen = !!localStorage.getItem("llmap-theme"); } catch (err) { /* 忽略 */ }
      if (chosen) return;
      root.setAttribute("data-theme", e.matches ? "dark" : "light");
      syncBtn();
    };
    if (mq.addEventListener) mq.addEventListener("change", onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }
})();


/* ── 語言切換(繁中 / English):套用靜態文案 + 重繪動態文字,選擇存 localStorage ── */
function applyI18n() {
  document.documentElement.setAttribute("lang", currentLang === "zh" ? "zh-Hant" : currentLang);
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = T(node.getAttribute("data-i18n"));
  for (const node of document.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", T(node.getAttribute("data-i18n-aria")));
  for (const node of document.querySelectorAll("[data-i18n-ph]")) node.setAttribute("placeholder", T(node.getAttribute("data-i18n-ph")));
  const tb = document.getElementById("themeToggle");
  if (tb) {
    const lbl = document.documentElement.getAttribute("data-theme") === "dark" ? T("themeToLight") : T("themeToDark");
    tb.setAttribute("aria-label", lbl); tb.title = lbl;
  }
}
function syncLangBtns() {
  for (const b of document.querySelectorAll(".lang-toggle button")) {
    const on = b.getAttribute("data-lang") === currentLang;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  }
}
function setLang(l) {
  currentLang = (l && I18N[l]) ? l : "zh";
  try { localStorage.setItem("llmap-lang", currentLang); } catch (err) { /* 隱私模式忽略 */ }
  applyI18n();
  renderDashboard();
  syncLangBtns();
}
(function () {
  for (const b of document.querySelectorAll(".lang-toggle button")) {
    b.addEventListener("click", function () { setLang(this.getAttribute("data-lang")); });
  }
  applyI18n();
  syncLangBtns();
})();
